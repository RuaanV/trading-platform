[project]
name = "trading-platform"
version = "0.1.0"
description = "Personal trading platform: portfolio snapshots, recommendations, market monitoring and a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies actually imported by data_pipeline/, src/ and dashboard/,
# plus dbt (invoked as a CLI by `make dbt-run`).
dependencies = [
    "pandas>=3.0",
    "numpy>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "yfinance>=1.0",
    "requests>=2.32",
    "streamlit>=1.50",
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
]

[dependency-groups]
# Research / modelling tooling. Installed by default with `uv sync`.
dev = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]
# Airflow is heavy (~200 transitive packages) and only used by the scaffolded DAG.
# Opt in with `uv sync --group airflow` (or `make install-airflow`).
airflow = [
    "apache-airflow>=3.0",
]

[tool.uv]
# This is an application, not an installable library.
package = false
default-groups = ["dev"]
